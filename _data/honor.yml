# 명예의 전당 (honor.md) 명단
# - members: assets/honor/<이름>.jpg 파일명. 순서대로 3명씩 자동으로 줄을 나눔 (빼면 뒤 사람이 당겨짐)
# - laurel: gold(백두혈통) / green(일반)
# - title: 그룹 위에 표시할 제목 (없으면 생략)

- title: 장단콩 창립 멤버
  laurel: gold
  members: [산도깨비, 헨리에타쨩, 찰리]

- title: 후원해 주신 분
